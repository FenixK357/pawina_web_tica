<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resultados</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Press Start 2P', cursive;
      background-color: #8bb8d6;
      padding: 20px;
      margin: 0;
    }
    .caja {
      background: #c6c6c6;
      padding: 25px;
      border: 4px solid #373737;
      box-shadow: inset -6px -6px 0px #8b8b8b, inset 6px 6px 0px #ffffff;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #373737;
      font-size: 16px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0px #fff;
    }
    .nota {
      text-align: center;
      font-size: 28px;
      color: #5b8731;
      margin-bottom: 30px;
      text-shadow: 2px 2px 0px #2c4a12;
    }
    .pregunta-item {
      margin-bottom: 15px;
      padding: 15px;
      background: #e0e0e0;
      border: 3px solid #373737;
    }
    .correcta { background: #b3ffb3; border-color: #1e5c1e; }
    .incorrecta { background: #ffb3b3; border-color: #a81111; }
    .pregunta-item h3 { margin: 0 0 15px 0; font-size: 10px; line-height: 1.5; color: #373737; }
    .res-user { font-size: 9px; margin-bottom: 8px; color: #555; }
    .res-correcta { font-size: 9px; color: #1e5c1e; font-weight: bold; }
    .btn-volver {
      width: 100%;
      padding: 15px;
      background: #5b8731;
      color: white;
      border: 3px solid #373737;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: inset -4px -4px 0px #2c4a12, inset 4px 4px 0px #8dc75b;
      text-shadow: 2px 2px 0px #2c4a12;
    }
    .btn-volver:active {
      box-shadow: inset 4px 4px 0px #2c4a12;
      transform: translateY(2px);
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>¡Resultados!</h1>
    <div class="nota" id="notaFinal">0 / 10</div>
    <div id="listaResultados"></div>
    <button class="btn-volver" onclick="window.location.href='menu.html'">VOLVER AL MENÚ</button>
  </div>

  <script>
    const preguntasOriginales = JSON.parse(sessionStorage.getItem('preguntasQuiz') || '[]');
    const respuestasDelUsuario = JSON.parse(sessionStorage.getItem('respuestasTemporales') || '[]');
    
    let aciertos = 0;
    const contenedor = document.getElementById('listaResultados');

    preguntasOriginales.forEach((p) => {
      const respuestaUser = respuestasDelUsuario.find(r => r.codigoPregunta === p.codigo);
      const esCorrecta = respuestaUser && respuestaUser.esCorrecta === "verdadero";
      
      if (esCorrecta) aciertos++;

      const div = document.createElement('div');
      div.className = `pregunta-item ${esCorrecta ? 'correcta' : 'incorrecta'}`;
      div.innerHTML = `
        <h3>${p.pregunta}</h3>
        <div class="res-user">Tu respuesta: ${respuestaUser ? respuestaUser.respuesta : 'Ninguna'} ${esCorrecta ? '✅' : '❌'}</div>
        <div class="res-correcta">Correcta: ${p.respuestaCorrecta}</div>
      `;
      contenedor.appendChild(div);
    });

    document.getElementById('notaFinal').textContent = `${aciertos} / ${preguntasOriginales.length}`;
    
    sessionStorage.removeItem('preguntasQuiz');
    sessionStorage.removeItem('respuestasTemporales');
  </script>
</body>
</html>
