<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selección de Temas</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Press Start 2P', cursive;
      background-color: #8bb8d6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .caja {
      background: #c6c6c6;
      padding: 25px;
      border: 4px solid #373737;
      box-shadow: inset -4px -4px 0px #8b8b8b, inset 4px 4px 0px #ffffff;
      width: 100%;
      max-width: 500px;
    }
    h2 {
      text-align: center;
      color: #3f3f3f;
      font-size: 14px;
      margin-bottom: 10px;
    }
    p {
      font-size: 9px;
      text-align: center;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .tema {
      display: flex;
      align-items: center;
      margin: 10px 0;
      padding: 12px;
      background: #e0e0e0;
      border: 2px solid #373737;
      cursor: pointer;
      font-size: 9px;
      line-height: 1.4;
      transition: 0.1s;
    }
    .tema:hover { background: #fff; }
    .tema input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 15px;
      cursor: pointer;
      accent-color: #5b8731;
    }
    .btn-principal {
      width: 100%;
      padding: 15px;
      background: #5b8731;
      color: white;
      border: 3px solid #373737;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: inset -4px -4px 0px #2c4a12, inset 4px 4px 0px #8dc75b;
      text-shadow: 2px 2px 0px #2c4a12;
    }
    .btn-principal:active:not(:disabled) {
      box-shadow: inset 4px 4px 0px #2c4a12;
      transform: translateY(2px);
    }
    .btn-principal:disabled {
      background: #8b8b8b;
      box-shadow: inset -4px -4px 0px #555, inset 4px 4px 0px #bbb;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h2>Elige tus Temas</h2>
    <p>Selecciona hasta 3 (mínimo 1).<br>Las preguntas se elegirán al azar.</p>
    <div id="listaTemas">Cargando temas...</div>
    <button id="btnComenzar" class="btn-principal" disabled onclick="comenzar()">COMENZAR</button>
  </div>

  <script>
    let temasSeleccionados = [];
    const listaDiv = document.getElementById('listaTemas');
    const btn = document.getElementById('btnComenzar');

    fetch('/api/temas').then(res => res.json()).then(temas => {
      listaDiv.innerHTML = '';
      temas.forEach(t => {
        const label = document.createElement('label');
        label.className = 'tema';
        label.innerHTML = `<input type="checkbox" value='${JSON.stringify(t)}' onchange="toggleTema(this)"> <div><b>${t.curso}</b><br>${t.id}</div>`;
        listaDiv.appendChild(label);
      });
    });

    function toggleTema(checkbox) {
      const tema = JSON.parse(checkbox.value);
      if (checkbox.checked) {
        temasSeleccionados.push(tema);
      } else {
        temasSeleccionados = temasSeleccionados.filter(t => t.id !== tema.id);
      }
      btn.disabled = temasSeleccionados.length === 0 || temasSeleccionados.length > 3;
    }

    async function comenzar() {
      btn.textContent = 'CARGANDO...';
      btn.disabled = true;
      const res = await fetch('/api/preguntas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ temasSeleccionados })
      });
      const preguntas = await res.json();
      sessionStorage.setItem('preguntasQuiz', JSON.stringify(preguntas));
      window.location.href = 'quiz.html';
    }
  </script>
</body>
</html>
